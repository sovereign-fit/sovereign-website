<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Page moved — Sovereign AI Systems</title>
  <!--
    Legacy-path catch-all for the Systeme.io -> apex decoupling.
    GitHub Pages cannot emit wildcard 301s, so unknown apex paths land here
    and are forwarded to the conversion subdomain, preserving the path.
    Remove or narrow this page once legacy funnel URLs have expired.
  -->
  <meta http-equiv="refresh" content="0; url=https://ecommerce.sovereignaisystems.co/" />
  <script>
    (function () {
      var path = window.location.pathname + window.location.search + window.location.hash;
      // Never redirect our own utility/system paths
      if (/^\/(api|internal)(\/|$)/.test(path)) return;
      window.location.replace('https://ecommerce.sovereignaisystems.co' + path);
    })();
  </script>
</head>
<body style="font-family: system-ui, sans-serif; background: #020617; color: #e2e8f0; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0;">
  <main style="text-align: center; max-width: 28rem; padding: 2rem;">
    <h1 style="font-size: 1.25rem; font-weight: 600;">This page has moved</h1>
    <p style="color: #94a3b8; margin-top: 0.75rem;">
      Our conversion pages now live on our dedicated funnel subdomain.
      If you are not redirected automatically,
      <a href="https://ecommerce.sovereignaisystems.co/" style="color: #34d399;">continue to ecommerce.sovereignaisystems.co</a>.
    </p>
  </main>
</body>
</html>
